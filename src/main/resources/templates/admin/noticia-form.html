<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Notícia</title>

    <link rel="stylesheet"
          th:href="@{/css/admin/admin.css}">

</head>

<body>

<header>

    <h1>Instituto Nosso Lar</h1>

    <a th:href="@{/admin/noticias}">
        Voltar
    </a>

</header>


<main>

    <h2 th:text="${noticia.id == null ? 'Nova notícia' : 'Editar notícia'}">Notícia</h2>

    <p class="form-error" th:if="${erro}" th:text="${erro}"></p>


    <form
        th:action="${noticia.id == null} ? @{/admin/noticias} : @{/admin/noticias/editar/{id}(id=${noticia.id})}"
        th:object="${noticia}"
        method="post"
        enctype="multipart/form-data">


        <label for="titulo">
            Título
        </label>

        <input
            type="text"
            id="titulo"
            th:field="*{titulo}"
            placeholder="Título da notícia"
            required>


        <label for="resumo">
            Resumo
        </label>

        <textarea
            id="resumo"
            th:field="*{resumo}"
            placeholder="Pequeno resumo que aparecerá no card">
        </textarea>


        <label for="conteudo">
            Conteúdo
        </label>

        <textarea
            id="conteudo"
            th:field="*{conteudo}"
            placeholder="Conteúdo completo da notícia">
        </textarea>


        <div class="imagem-atual" th:if="${noticia.imagem != null and !noticia.imagem.isBlank()}">
            <label>Imagem atual</label>
            <img th:src="${#strings.startsWith(noticia.imagem, '/') ? noticia.imagem : '/' + noticia.imagem}"
                 th:alt="${noticia.titulo}" width="250">
        </div>

        <label for="arquivo" th:text="${noticia.imagem != null and !noticia.imagem.isBlank() ? 'Trocar imagem' : 'Imagem'}">Imagem</label>
        <input type="file" id="arquivo" name="arquivo" accept="image/jpeg,image/png,image/gif">
        <small>JPEG, PNG ou GIF, com no máximo 2 MB e 4096 × 4096 pixels.</small>

        <label th:if="${noticia.id != null and noticia.imagem != null and !noticia.imagem.isBlank()}">
            <input type="checkbox" name="removerImagem" value="true">
            Remover a imagem atual
        </label>


        <label for="dataPublicacao">
            Data da publicação
        </label>

        <input
            type="date"
            id="dataPublicacao"
            th:field="*{dataPublicacao}">


        <label>

            <input
                type="checkbox"
                th:field="*{ativo}">

            Notícia ativa

        </label>


        <button type="submit">
            Salvar
        </button>

    </form>

</main>

</body>

</html>
