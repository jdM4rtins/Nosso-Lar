<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar senha - Instituto Nosso Lar</title>
    <link rel="stylesheet" th:href="@{/css/admin/admin.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/acessibilidade.css}">
</head>
<body class="login-page">
    <div th:replace="~{fragments/acessibilidade :: atalhos}"></div>
<main class="login-layout" id="conteudo" tabindex="-1">
    <section class="login-brand" aria-label="Instituto Nosso Lar">
        <img src="/NL_Img/NossoLarLogo.png" alt="Instituto Nosso Lar">
        <p class="login-eyebrow">SEGURANÇA</p>
        <h1>Crie sua<br>senha pessoal</h1>
        <p>A senha temporária precisa ser substituída antes de acessar a administração.</p>
    </section>

    <section class="login-panel">
        <div class="login-panel-heading">
            <p class="login-eyebrow">PRIMEIRO ACESSO</p>
            <h2>Alterar senha</h2>
            <p>A senha deve ter pelo menos 12 caracteres, com letras maiúsculas e minúsculas, número e símbolo.</p>
        </div>

        <div th:if="${erro}" class="login-error" role="alert">
            <p th:text="${erro}">Não foi possível alterar a senha.</p>
        </div>

        <form th:action="@{/alterar-senha}" method="post">
            <label for="novaSenha">Nova senha</label>
            <div class="password-field">
                <input type="password" id="novaSenha" name="novaSenha" autocomplete="new-password" minlength="12" required>
                <button class="password-toggle" type="button" aria-label="Mostrar senha" aria-pressed="false" data-password-toggle="novaSenha"><i class="fa-solid fa-eye" aria-hidden="true"></i></button>
            </div>

            <label for="confirmacao">Confirmar nova senha</label>
            <div class="password-field">
                <input type="password" id="confirmacao" name="confirmacao" autocomplete="new-password" minlength="12" required>
                <button class="password-toggle" type="button" aria-label="Mostrar senha" aria-pressed="false" data-password-toggle="confirmacao"><i class="fa-solid fa-eye" aria-hidden="true"></i></button>
            </div>

            <button type="submit">Salvar nova senha</button>
        </form>

        <form th:action="@{/logout}" method="post">
            <button type="submit">Sair</button>
        </form>
    </section>
</main>
<script th:src="@{/js/password-toggle.js}"></script>

    <div th:replace="~{fragments/acessibilidade :: vlibras}"></div>
</body>
</html>
