<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Novo Administrador</title>

    <link rel="stylesheet"
          th:href="@{/css/admin/admin.css}">

</head>

<body>

<header>

    <h1>Instituto Nosso Lar</h1>

    <a th:href="@{/admin/administradores}">
        Voltar
    </a>

</header>

<main>

    <h2>Novo Administrador</h2>

    <div th:if="${erro}">
        <p th:text="${erro}"
           style="color: red;">
        </p>
    </div>

    <form
        th:action="@{/admin/administradores}"
        th:object="${administrador}"
        method="post">

        <label for="nome">
            Nome
        </label>

        <input
            type="text"
            id="nome"
            th:field="*{nome}"
            required
        >

        <label for="email">
            E-mail
        </label>

        <input
            type="email"
            id="email"
            th:field="*{email}"
            required
        >

        <label for="senha">
            Senha
        </label>

        <input
            type="password"
            id="senha"
            th:field="*{senha}"
            required
        >

        <button type="submit">
            Cadastrar administrador
        </button>

    </form>

</main>

</body>

</html>
