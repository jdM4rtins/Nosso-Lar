<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Atividades</title>

    <link rel="stylesheet"
          th:href="@{/css/admin/admin.css}">

    <link rel="stylesheet" th:href="@{/css/acessibilidade.css}">
</head>

<body>
    <div th:replace="~{fragments/acessibilidade :: atalhos}"></div>

<header>

    <h1>Instituto Nosso Lar</h1>

    <a th:href="@{/admin/dashboard}">Voltar ao painel</a>

</header>

<main id="conteudo" tabindex="-1">

    <h2>Atividades</h2>

    <a sec:authorize="hasAuthority('CREATE_CONTENT')" th:href="@{/admin/atividades/novo}">
        + Nova atividade
    </a>

    <table>

        <thead>

            <tr>

                <th scope="col">ID</th>
                <th scope="col">Imagem</th>
                <th scope="col">Nome</th>
                <th scope="col">Status</th>
                <th scope="col">Ações</th>

            </tr>

        </thead>

        <tbody>

            <tr th:each="atividade : ${atividades}">

                <td th:text="${atividade.id}">
                    1
                </td>

                <td>

                    <img
                        th:src="@{'/' + ${atividade.imagem}}"
                        th:alt="${atividade.nome}"
                        width="100">

                </td>

                <td th:text="${atividade.nome}">
                    Artesanatos
                </td>

                <td>

                    <span th:if="${atividade.ativo}" class="status ativo">
                        Ativo
                    </span>

                    <span th:unless="${atividade.ativo}" class="status inativo">
                        Inativo
                    </span>

                </td>

                <td>

                    <a sec:authorize="hasAuthority('UPDATE_CONTENT')"
                        th:href="@{/admin/atividades/editar/{id}(id=${atividade.id})}">
                        Editar
                    </a>

                    <form sec:authorize="hasAuthority('DELETE_CONTENT')"
                          th:action="@{/admin/atividades/excluir/{id}(id=${atividade.id})}"
                          method="post" style="display:inline"
                          onsubmit="return confirm('Deseja realmente excluir esta atividade?')">
                        <button type="submit">Excluir</button>
                    </form>

                </td>

            </tr>

        </tbody>

    </table>

</main>


    <div th:replace="~{fragments/acessibilidade :: vlibras}"></div>
</body>

</html>
