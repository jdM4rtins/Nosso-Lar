<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo evento</title>
    <link rel="stylesheet" th:href="@{/css/admin/admin.css}">
</head>
<body>
<header>
    <h1>Instituto Nosso Lar</h1>
    <a th:href="@{/admin/eventos}">Voltar</a>
</header>
<main>
    <h2>Novo evento</h2>
    <p class="form-error" th:if="${erro}" th:text="${erro}"></p>

    <form th:action="@{/admin/eventos}" th:object="${evento}" method="post" enctype="multipart/form-data">
        <label for="titulo">Título</label>
        <input type="text" id="titulo" th:field="*{titulo}" maxlength="255" required>

        <label for="descricao">Descrição</label>
        <textarea id="descricao" th:field="*{descricao}" placeholder="Apresente o evento ao público"></textarea>

        <label for="dataInicio">Data e hora de início</label>
        <input type="datetime-local" id="dataInicio" th:field="*{dataInicio}" required>

        <label for="dataFim">Data e hora de término</label>
        <input type="datetime-local" id="dataFim" th:field="*{dataFim}">

        <label for="local">Local</label>
        <input type="text" id="local" th:field="*{local}" maxlength="255">

        <label for="link">Link para informações ou inscrição</label>
        <input type="url" id="link" th:field="*{link}" placeholder="https://...">

        <label for="arquivo">Imagem do evento</label>
        <input type="file" id="arquivo" name="arquivo" accept="image/jpeg,image/png,image/gif" required>
        <small>JPEG, PNG ou GIF, com no máximo 2 MB e 4096 × 4096 pixels.</small>

        <label for="alt">Descrição acessível da imagem</label>
        <input type="text" id="alt" th:field="*{alt}" maxlength="255" placeholder="Descreva o que aparece na imagem">

        <label><input type="checkbox" th:field="*{ativo}"> Evento ativo</label>
        <button type="submit">Salvar</button>
    </form>
</main>
</body>
</html>
