<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo usuário</title>
    <link rel="stylesheet" th:href="@{/css/admin/admin.css}">
</head>
<body>
<header>
    <h1>Instituto Nosso Lar</h1>
    <a th:href="@{/admin/administradores}">Voltar</a>
</header>
<main>
    <h2>Novo usuário</h2>
    <p th:if="${erro}" th:text="${erro}" class="status inativo"></p>

    <form th:action="@{/admin/administradores}" method="post">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" th:value="${nome}" required>

        <label for="emailLocal">E-mail institucional</label>
        <div class="email-domain-field">
            <input type="text" id="emailLocal" name="emailLocal" th:value="${emailLocal}"
                   autocomplete="off" maxlength="64" pattern="[A-Za-z0-9!#$%&amp;'*+/=?^_`{|}~-]+(\.[A-Za-z0-9!#$%&amp;'*+/=?^_`{|}~-]+)*"
                   aria-describedby="emailDomainHint" required>
            <span class="email-domain-suffix" aria-hidden="true">@nossolar.gustavocardilho.com.br</span>
        </div>
        <small id="emailDomainHint">Informe somente a parte anterior ao @. O domínio institucional será adicionado automaticamente.</small>

        <label for="perfil">Perfil</label>
        <select id="perfil" name="perfil" required>
            <option th:each="perfil : ${perfis}"
                    th:value="${perfil.nome}"
                    th:text="${perfil.nome}"
                    th:selected="${perfil.nome == perfilSelecionado}">EDITOR</option>
        </select>

        <label for="senha">Senha temporária</label>
        <input type="password" id="senha" name="senha"
               autocomplete="new-password" minlength="12" required>
        <p>Use pelo menos 12 caracteres, com maiúscula, minúscula, número e símbolo. O usuário deverá trocá-la no primeiro acesso.</p>

        <button type="submit">Cadastrar usuário</button>
    </form>
</main>
</body>
</html>
