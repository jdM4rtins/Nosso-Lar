<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar usuário</title>
    <link rel="stylesheet" th:href="@{/css/admin/admin.css}">
</head>
<body>
<header>
    <h1>Instituto Nosso Lar</h1>
    <a th:href="@{/admin/administradores}">Voltar</a>
</header>
<main>
    <h2>Editar usuário</h2>
    <form th:action="@{/admin/administradores/editar/{id}(id=${administrador.id})}" method="post">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" th:value="${administrador.nome}" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" th:value="${administrador.email}" required>

        <label for="perfil">Perfil</label>
        <select id="perfil" name="perfil" required>
            <option th:each="perfil : ${perfis}"
                    th:value="${perfil.nome}"
                    th:text="${perfil.nome}"
                    th:selected="${perfil.nome == perfilSelecionado}">EDITOR</option>
        </select>

        <button type="submit">Salvar alterações</button>
    </form>
</main>
</body>
</html>
