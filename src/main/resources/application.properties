spring.application.name=InstitutoNossoLar

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/instituto_nosso_lar}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Migrations: a base existente é registrada como baseline; novas alterações entram em V2+.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

# Thymeleaf
spring.thymeleaf.cache=false

# Uploads usados em atividades e eventos.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Recuperação de senha via API oficial do Resend.
app.resend.api-key=${RESEND_API_KEY:}
app.resend.from=${RESEND_FROM:noreply@nossolar.com}
app.public-url=${APP_PUBLIC_URL:http://localhost:8080}
app.recovery-token-expiration=${RECOVERY_TOKEN_EXPIRATION:PT1H}

# Proteção contra tentativa de login/recuperação em excesso.
app.auth.max-attempts=${AUTH_MAX_ATTEMPTS:3}
app.auth.block-duration=${AUTH_BLOCK_DURATION:PT15M}
app.auth.attempt-window=${AUTH_ATTEMPT_WINDOW:PT15M}

# Backup local opcional. Em produção, use um volume persistente; por padrão não executa.
app.backup.enabled=${BACKUP_ENABLED:false}
app.backup.schedule=${BACKUP_SCHEDULE:0 0 3 * * *}
app.backup.directory=${BACKUP_DIRECTORY:./backups}
app.backup.retention-days=${BACKUP_RETENTION_DAYS:30}
app.backup.pg-dump-command=${PG_DUMP_COMMAND:pg_dump}

# Porta
server.port=${PORT:8080}

# Sessão administrativa
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
