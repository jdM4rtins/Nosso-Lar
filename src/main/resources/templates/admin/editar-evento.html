<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Editar evento</title>

    <link rel="stylesheet"
          th:href="@{/css/admin/admin.css}">

</head>

<body>

<header>

    <h1>Instituto Nosso Lar</h1>

    <a th:href="@{/admin/eventos}">
        Voltar
    </a>

</header>

<main>

    <h2>Editar evento</h2>

    <form
        th:action="@{/admin/eventos/editar/{id}(id=${evento.id})}"
        method="post"
        enctype="multipart/form-data">

        <label>
            Imagem atual
        </label>

        <div class="imagem-atual">

            <img
                th:src="@{/${evento.imagem}}"
                th:alt="${evento.alt}">

        </div>


        <label for="arquivo">
            Trocar imagem
        </label>

        <input
            type="file"
            id="arquivo"
            name="arquivo"
            accept="image/*">


        <label for="alt">
            Descrição da imagem
        </label>

        <input
            type="text"
            id="alt"
            name="alt"
            th:value="${evento.alt}">


        <label>

            <input
                type="checkbox"
                name="ativo"
                th:checked="${evento.ativo}">

            Evento ativo

        </label>


        <button type="submit">
            Salvar alterações
        </button>

    </form>

</main>

</body>

</html>
