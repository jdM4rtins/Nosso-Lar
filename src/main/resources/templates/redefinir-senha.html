<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nova senha</title><link rel="stylesheet" th:href="@{/css/admin/admin.css}"></head>
<body class="login-page"><main class="login-layout"><section class="login-brand"><img src="/NL_Img/NossoLarLogo.png" alt="Instituto Nosso Lar"><p class="login-eyebrow">SEGURANÇA</p><h1>Defina uma<br>nova senha</h1><p>Escolha uma senha pessoal e forte para sua conta.</p></section><section class="login-panel"><div class="login-panel-heading"><p class="login-eyebrow">RECUPERAÇÃO</p><h2>Nova senha</h2><p>Use pelo menos 12 caracteres, com maiúscula, minúscula, número e símbolo.</p></div><div th:if="${erro}" class="login-error"><p th:text="${erro}"></p></div><div th:unless="${tokenValido}" class="login-error"><p>Este link é inválido ou expirou. Solicite uma nova recuperação.</p><p><a href="/recuperar-senha">Solicitar novo link</a></p></div><form th:if="${tokenValido}" method="post" th:action="@{/redefinir-senha}"><input type="hidden" name="token" th:value="${token}"><label for="novaSenha">Nova senha</label><input type="password" id="novaSenha" name="novaSenha" minlength="12" autocomplete="new-password" required><label for="confirmacao">Confirmar nova senha</label><input type="password" id="confirmacao" name="confirmacao" minlength="12" autocomplete="new-password" required><button type="submit">Salvar nova senha</button></form></section></main></body></html>
