<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Conteúdos</title>

    <link rel="stylesheet"
          th:href="@{/css/admin/admin.css}">

    <link rel="stylesheet" th:href="@{/css/acessibilidade.css}">
</head>

<body>
    <div th:replace="~{fragments/acessibilidade :: atalhos}"></div>

<header>

    <h1>Instituto Nosso Lar</h1>

    <a th:href="@{/admin/dashboard}">
        Voltar ao painel
    </a>

</header>

<main id="conteudo" tabindex="-1">

    <h2>Conteúdos do site</h2>

    <a sec:authorize="hasAuthority('CREATE_CONTENT')" th:href="@{/admin/conteudos/novo}">
        + Novo conteúdo
    </a>

    <table>

        <thead>

            <tr>
                <th scope="col">ID</th>
                <th scope="col">Chave</th>
                <th scope="col">Título</th>
                <th scope="col">Status</th>
                <th scope="col">Ações</th>
            </tr>

        </thead>

        <tbody>

            <tr th:each="conteudo : ${conteudos}">

                <td th:text="${conteudo.id}">
                    1
                </td>

                <td th:text="${conteudo.chave}">
                    inicio
                </td>

                <td th:text="${conteudo.titulo}">
                    Instituto Nosso Lar
                </td>

                <td>

                    <span th:if="${conteudo.ativo}"
                        class="status ativo">
                        Ativo
                    </span>

                    <span th:unless="${conteudo.ativo}"
                        class="status inativo">
                        Inativo
                    </span>

                </td>

                <td>

                    <a sec:authorize="hasAuthority('UPDATE_CONTENT')"
                       th:href="@{/admin/conteudos/editar/{id}(id=${conteudo.id})}">
                        Editar
                    </a>

                    <form sec:authorize="hasAuthority('DELETE_CONTENT')"
                          th:action="@{/admin/conteudos/excluir/{id}(id=${conteudo.id})}"
                          method="post" style="display:inline"
                          onsubmit="return confirm('Deseja realmente excluir este conteúdo?')">
                        <button type="submit">Excluir</button>
                    </form>

                </td>

            </tr>

        </tbody>

    </table>

</main>


    <div th:replace="~{fragments/acessibilidade :: vlibras}"></div>
</body>

</html>
