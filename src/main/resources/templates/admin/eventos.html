<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Eventos</title>

    <link rel="stylesheet"
          th:href="@{/css/admin/admin.css}">

</head>

<body>

<header>

    <h1>Instituto Nosso Lar</h1>

    <a th:href="@{/admin/dashboard}">Voltar ao painel</a>

</header>

<main>

    <h2>Eventos</h2>

    <a sec:authorize="hasAuthority('CREATE_CONTENT')" th:href="@{/admin/eventos/novo}">
        + Novo evento
    </a>

    <table>

        <thead>

            <tr>
                <th>ID</th>
                <th>Título</th>
                <th>Início</th>
                <th>Local</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>

        </thead>

        <tbody>

            <tr th:each="evento : ${eventos}">

                <td th:text="${evento.id}">
                    1
                </td>

                <td th:text="${evento.titulo != null ? evento.titulo : 'Evento ainda não preenchido'}">
                    Evento
                </td>

                <td th:text="${evento.dataInicio != null ? #temporals.format(evento.dataInicio, 'dd/MM/yyyy HH:mm') : 'Sem data'}">
                    10/10/2026 14:00
                </td>

                <td th:text="${evento.local != null and !evento.local.isBlank() ? evento.local : 'Não informado'}">
                    Instituto Nosso Lar
                </td>

                <td>

                    <span th:if="${evento.ativo}" class="status ativo">
                        Ativo
                    </span>

                    <span th:unless="${evento.ativo}" class="status inativo">
                        Inativo
                    </span>

                </td>

                <td>

                    <a th:href="@{/admin/eventos/editar/{id}(id=${evento.id})}">
                        Editar
                    </a>

                    <form sec:authorize="hasAuthority('DELETE_CONTENT')"
                          th:action="@{/admin/eventos/excluir/{id}(id=${evento.id})}"
                          method="post" style="display:inline"
                          onsubmit="return confirm('Deseja realmente excluir este evento?')">
                        <button type="submit">Excluir</button>
                    </form>

                </td>

            </tr>

        </tbody>

    </table>

</main>

</body>

</html>
