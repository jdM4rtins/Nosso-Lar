<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nova senha</title><link rel="stylesheet" th:href="@{/css/admin/admin.css}"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous"></head>
<body class="login-page"><main class="login-layout"><section class="login-brand"><img src="/NL_Img/NossoLarLogo.png" alt="Instituto Nosso Lar"><p class="login-eyebrow">SEGURANÇA</p><h1>Defina uma<br>nova senha</h1><p>Escolha uma senha pessoal e forte para sua conta.</p></section><section class="login-panel"><div class="login-panel-heading"><p class="login-eyebrow">RECUPERAÇÃO</p><h2>Nova senha</h2><p>A senha deve ter pelo menos 12 caracteres, com letras maiúsculas e minúsculas, número e símbolo.</p></div><div th:if="${erro}" class="login-error"><p th:text="${erro}"></p></div><div th:unless="${tokenValido}" class="login-error"><p>Este link é inválido ou expirou. Solicite uma nova recuperação.</p><p><a href="/recuperar-senha">Solicitar novo link</a></p></div><form th:if="${tokenValido}" method="post" th:action="@{/redefinir-senha}"><input type="hidden" name="token" th:value="${token}"><label for="novaSenha">Nova senha</label><div class="password-field"><input type="password" id="novaSenha" name="novaSenha" minlength="12" autocomplete="new-password" required><button class="password-toggle" type="button" aria-label="Mostrar senha" aria-pressed="false" data-password-toggle="novaSenha"><i class="fa-solid fa-eye" aria-hidden="true"></i></button></div><label for="confirmacao">Confirmar nova senha</label><div class="password-field"><input type="password" id="confirmacao" name="confirmacao" minlength="12" autocomplete="new-password" required><button class="password-toggle" type="button" aria-label="Mostrar senha" aria-pressed="false" data-password-toggle="confirmacao"><i class="fa-solid fa-eye" aria-hidden="true"></i></button></div><button type="submit">Salvar nova senha</button></form></section></main><script th:src="@{/js/password-toggle.js}"></script></body></html>
