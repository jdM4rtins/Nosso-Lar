<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários administrativos</title>
    <link rel="stylesheet" th:href="@{/css/admin/admin.css}">
</head>
<body>
<header>
    <h1>Instituto Nosso Lar</h1>
    <a th:href="@{/admin/dashboard}">Voltar ao painel</a>
</header>
<main>
    <h2>Usuários administrativos</h2>
    <a sec:authorize="hasAuthority('CREATE_EDITOR') or hasAuthority('CREATE_ADMIN')"
       th:href="@{/admin/administradores/novo}">+ Novo usuário</a>

    <p th:if="${sucesso}" th:text="${sucesso}" class="status ativo"></p>
    <p th:if="${erro}" th:text="${erro}" class="status inativo"></p>
    <p th:if="${param.criado}" class="status ativo">Usuário criado com senha temporária.</p>

    <table>
        <thead>
        <tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Status</th><th>Cadastro</th><th>Ações</th></tr>
        </thead>
        <tbody>
        <tr th:each="administrador : ${administradores}">
            <td th:text="${administrador.nome}">Nome</td>
            <td th:text="${administrador.email}">email@nossolar.com</td>
            <td>
                <span th:each="perfil, estado : ${administrador.perfis}">
                    <span th:text="${perfil.nome}">EDITOR</span><span th:if="${!estado.last}">, </span>
                </span>
            </td>
            <td th:text="${administrador.ativo} ? 'Ativo' : 'Inativo'">Ativo</td>
            <td th:text="${administrador.dataCadastro}">Data</td>
            <td>
                <span th:if="${administrador.email == emailAtual}">Conta atual</span>
                <div th:if="${idsGerenciaveis.contains(administrador.id)}">
                    <a sec:authorize="hasAuthority('UPDATE_USER')"
                       th:href="@{/admin/administradores/editar/{id}(id=${administrador.id})}">Editar</a>
                    <form sec:authorize="hasAuthority('DISABLE_USER')"
                          th:action="@{/admin/administradores/status/{id}(id=${administrador.id})}"
                          method="post" style="display:inline">
                        <button type="submit"
                                th:text="${administrador.ativo} ? 'Desativar' : 'Ativar'">Desativar</button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
