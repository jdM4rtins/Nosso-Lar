<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Recuperar senha</title><link rel="stylesheet" th:href="@{/css/admin/admin.css}"></head>
<body class="login-page"><main class="login-layout"><section class="login-brand"><img src="/NL_Img/NossoLarLogo.png" alt="Instituto Nosso Lar"><p class="login-eyebrow">SEGURANÇA</p><h1>Recupere<br>sua senha</h1><p>Enviaremos as instruções para o e-mail cadastrado.</p></section><section class="login-panel"><div class="login-panel-heading"><p class="login-eyebrow">ACESSO RESTRITO</p><h2>Esqueci minha senha</h2></div><div th:if="${solicitado}" class="login-success"><p>Se o e-mail estiver cadastrado e ativo, você receberá um link para redefinir a senha.</p></div><form th:unless="${solicitado}" method="post" th:action="@{/recuperar-senha}"><label for="email">E-mail</label><input type="email" id="email" name="email" autocomplete="email" required><button type="submit">Enviar instruções</button></form><p><a href="/login">Voltar ao login</a></p></section></main></body></html>
